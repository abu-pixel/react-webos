<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070812" />
  <meta name="description" content="AETHER OS — an elite browser-based desktop environment built with React." />
  <title>AETHER OS — Desktop</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root{
      --accent:#8b5cf6;--accent2:#22d3ee;--accent-soft:rgba(139,92,246,.16);
      --text:#eef0ff;--muted:#9aa3c0;
      --glass:rgba(14,16,30,.70);--glass-strong:rgba(11,13,26,.90);
      --win-bg:linear-gradient(165deg,rgba(24,27,48,.94),rgba(12,14,27,.96));
      --panel:rgba(255,255,255,.035);--panel-hover:rgba(255,255,255,.07);
      --stroke:rgba(255,255,255,.09);--stroke-strong:rgba(255,255,255,.16);
      --shadow:0 30px 80px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.35);
      --radius:16px;--topbar:40px;--dock-h:74px;
      font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark;
    }
    :root[data-theme="light"]{
      --text:#1b2040;--muted:#667093;--glass:rgba(255,255,255,.72);--glass-strong:rgba(255,255,255,.94);
      --win-bg:linear-gradient(165deg,rgba(255,255,255,.96),rgba(240,243,255,.96));
      --panel:rgba(30,40,90,.04);--panel-hover:rgba(30,40,90,.09);
      --stroke:rgba(30,40,90,.11);--stroke-strong:rgba(30,40,90,.20);
      --shadow:0 30px 80px rgba(40,50,100,.20),0 2px 10px rgba(40,50,100,.12);color-scheme:light;
    }
    :root[data-theme="eclipse"]{
      --text:#e9ffe9;--muted:#7f9e8c;--glass:rgba(5,12,9,.78);--glass-strong:rgba(4,10,7,.94);
      --win-bg:linear-gradient(165deg,rgba(10,24,16,.96),rgba(4,11,8,.97));
      --panel:rgba(120,255,170,.045);--panel-hover:rgba(120,255,170,.09);
      --stroke:rgba(140,255,180,.12);--stroke-strong:rgba(140,255,180,.22);color-scheme:dark;
    }
    :root[data-accent="cyan"]{--accent:#22d3ee;--accent2:#818cf8;--accent-soft:rgba(34,211,238,.16)}
    :root[data-accent="rose"]{--accent:#fb7185;--accent2:#f59e0b;--accent-soft:rgba(251,113,133,.16)}
    :root[data-accent="lime"]{--accent:#a3e635;--accent2:#34d399;--accent-soft:rgba(163,230,53,.16)}
    :root[data-accent="amber"]{--accent:#fbbf24;--accent2:#fb7185;--accent-soft:rgba(251,191,36,.16)}
    :root[data-accent="blue"]{--accent:#60a5fa;--accent2:#c084fc;--accent-soft:rgba(96,165,250,.16)}

    *{box-sizing:border-box}
    html,body,#root{height:100%;margin:0}
    body{background:#05060d;color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
    button,input,textarea,select{font:inherit;color:inherit}
    button{cursor:pointer}
    ::-webkit-scrollbar{width:9px;height:9px}
    ::-webkit-scrollbar-thumb{background:rgba(150,160,210,.22);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
    ::-webkit-scrollbar-thumb:hover{background:rgba(150,160,210,.38);background-clip:padding-box}
    ::selection{background:var(--accent);color:#fff}

    /* Desktop & wallpapers */
    .desktop{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate}
    .wallpaper{position:absolute;inset:0;overflow:hidden;background:#05060d;transition:filter .3s}
    .wallpaper::before{content:"";position:absolute;inset:-30%;background:radial-gradient(38% 42% at 22% 28%,var(--w1) 0%,transparent 65%),radial-gradient(42% 46% at 78% 26%,var(--w2) 0%,transparent 62%),radial-gradient(46% 50% at 52% 88%,var(--w3) 0%,transparent 65%);filter:blur(36px);animation:drift 26s ease-in-out infinite alternate}
    .wallpaper::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.55) 100%)}
    .wall-nebula{--w1:#4c1d95;--w2:#0e7490;--w3:#db2777}
    .wall-aurora{--w1:#065f46;--w2:#1d4ed8;--w3:#7c3aed}
    .wall-sunset{--w1:#f97316;--w2:#be123c;--w3:#6d28d9}
    .wall-ocean{--w1:#0e7490;--w2:#1e3a8a;--w3:#0f766e}
    .wall-mono{--w1:#334155;--w2:#1e293b;--w3:#475569}
    .wall-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(to bottom,transparent 0%,#000 35%,#000 100%);pointer-events:none}
    .wall-glow{position:absolute;width:420px;height:420px;border:1px solid rgba(255,255,255,.07);border-radius:50%;left:50%;top:45%;transform:translate(-50%,-50%);box-shadow:0 0 160px rgba(139,92,246,.12) inset;pointer-events:none}
    .wall-glow::before,.wall-glow::after{content:"";position:absolute;inset:16%;border:1px solid rgba(255,255,255,.05);border-radius:50%}
    .wall-glow::after{inset:32%;border-color:var(--accent-soft)}
    .wall-custom{position:absolute;inset:0;background-size:cover;background-position:center}
    .wall-scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 4px);pointer-events:none;opacity:.5}
    @keyframes drift{0%{transform:translate3d(-3%,-2%,0) scale(1)}50%{transform:translate3d(3%,2%,0) scale(1.08)}100%{transform:translate3d(-2%,3%,0) scale(1.03)}}

    /* Shared primitives */
    .glass{background:var(--glass);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--stroke);box-shadow:var(--shadow)}
    .panel{background:var(--panel);border:1px solid var(--stroke);border-radius:14px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--stroke);background:var(--panel);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:600;color:var(--text);transition:.16s ease;white-space:nowrap}
    .btn:hover{background:var(--panel-hover);border-color:var(--stroke-strong);transform:translateY(-1px)}
    .btn:active{transform:translateY(0) scale(.98)}
    .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 8px 24px var(--accent-soft)}
    .btn.icon{width:32px;height:32px;padding:0;border-radius:9px}
    .btn.danger{color:#fb7185;border-color:rgba(251,113,133,.28)}
    .btn.ghost{background:transparent;border-color:transparent}
    .btn.ghost:hover{background:var(--panel-hover)}
    input,textarea,select{background:rgba(0,0,0,.16);border:1px solid var(--stroke);border-radius:10px;padding:9px 11px;outline:none;min-width:0}
    :root[data-theme="light"] input,:root[data-theme="light"] textarea,:root[data-theme="light"] select{background:rgba(255,255,255,.7)}
    input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    label{font-size:12px;color:var(--muted);font-weight:600}
    .muted{color:var(--muted)}
    .tiny{font-size:11px}
    .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
    .display{font-family:'Space Grotesk',Inter,sans-serif}
    .row{display:flex;align-items:center;gap:8px}
    .col{display:flex;flex-direction:column;gap:8px}
    .grow{flex:1;min-width:0;min-height:0}
    .sep{height:1px;background:var(--stroke);margin:8px 0}
    .badge{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
    .switch{width:38px;height:22px;border-radius:20px;background:rgba(140,150,190,.22);border:1px solid var(--stroke);position:relative;transition:.2s;flex:none}
    .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
    .switch.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
    .switch.on::after{transform:translateX(16px)}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:var(--panel);border:1px solid var(--stroke);font-size:11px;color:var(--muted)}
    .empty{height:100%;min-height:180px;display:grid;place-items:center;text-align:center;color:var(--muted);gap:8px;padding:24px}
    .empty .big{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin:0 auto 10px}

    /* Top bar */
    .topbar{position:absolute;left:0;right:0;top:0;height:var(--topbar);z-index:1200;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(180deg,rgba(8,9,18,.66),rgba(8,9,18,.28));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06);font-size:12px}
    :root[data-theme="light"] .topbar{background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.35))}
    .brand{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.14em;font-size:12px}
    .brand-mark{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 18px var(--accent-soft)}
    .topbar-btn{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text);font-size:12px;transition:.15s}
    .topbar-btn:hover{background:var(--panel-hover);border-color:var(--stroke)}
    .topbar-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-weight:600}
    .topbar-right{margin-left:auto;display:flex;align-items:center;gap:4px}
    .status-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80}

    /* Popovers */
    .popover{position:absolute;z-index:1300;top:46px;width:320px;padding:14px;border-radius:18px;animation:pop .18s ease}
    .popover.right{right:14px}
    .popover.left{left:14px;width:290px}
    @keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
    .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
    .quick-tile{height:58px;border-radius:12px;background:var(--panel);border:1px solid var(--stroke);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--muted);transition:.15s}
    .quick-tile:hover{background:var(--panel-hover)}
    .quick-tile.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
    .slider{width:100%;accent-color:var(--accent);height:4px;padding:0;border:0;background:transparent;box-shadow:none}
    .slider:focus{box-shadow:none}
    .notif-item{padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--stroke);margin-bottom:8px;display:flex;gap:10px;animation:toastIn .25s ease}
    .notif-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}

    /* Desktop icons & widgets */
    .desk-icons{position:absolute;left:16px;top:62px;display:flex;flex-direction:column;gap:4px;z-index:200}
    .desk-icon{width:90px;padding:9px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:default;border:1px solid transparent;position:absolute;user-select:none;transition:background .15s,border .15s}
    .desk-icon:hover{background:rgba(255,255,255,.05)}
    .desk-icon.selected{background:var(--accent-soft);border-color:var(--accent)}
    .desk-icon .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid var(--stroke);box-shadow:0 10px 24px rgba(0,0,0,.28);color:var(--accent)}
    .desk-icon .lbl{font-size:11px;font-weight:600;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.7);line-height:1.25}
    .widget-stack{position:absolute;right:18px;top:62px;width:226px;display:flex;flex-direction:column;gap:12px;z-index:200}
    .widget{padding:15px;border-radius:18px;position:relative;overflow:hidden}
    .widget-title{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800;margin-bottom:10px}
    .clock-face{width:104px;height:104px;margin:2px auto 8px;position:relative;border-radius:50%;border:1px solid var(--stroke);background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.08),transparent 60%)}
    .clock-face .tick{position:absolute;left:50%;top:50%;width:1px;height:5px;background:var(--stroke-strong);transform-origin:50% 0}
    .hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:4px;background:var(--text)}
    .hand.h{width:3px;height:26px}.hand.m{width:2px;height:36px}.hand.s{width:1px;height:40px;background:var(--accent)}
    .clock-center{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%)}
    .spark{width:100%;height:44px;overflow:visible}
    .metric{display:flex;justify-content:space-between;font-size:11px;margin-top:6px;color:var(--muted)}
    .metric b{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px}
    /* Windows */
    .window{position:absolute;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;background:var(--win-bg);border:1px solid var(--stroke-strong);box-shadow:var(--shadow),0 0 0 1px rgba(0,0,0,.18);min-width:320px;min-height:200px;animation:winIn .26s cubic-bezier(.2,.9,.25,1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
    .window.minimized{display:none}
    .window:not(.active){box-shadow:0 18px 45px rgba(0,0,0,.4)}
    .window.maximized{border-radius:0}
    @keyframes winIn{from{opacity:0;transform:translateY(14px) scale(.965)}to{opacity:1;transform:none}}
    .window::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);opacity:.75;z-index:5}
    .titlebar{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.018);cursor:grab;user-select:none}
    .titlebar:active{cursor:grabbing}
    .lights{display:flex;gap:7px;align-items:center}
    .light{width:11px;height:11px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:800;color:rgba(0,0,0,.55);transition:.15s;cursor:pointer}
    .light:hover{filter:brightness(1.25);transform:scale(1.15)}
    .light.close{background:#ff5f57}.light.min{background:#febc2e}.light.max{background:#28c840}
    .title-text{font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .title-text .app-ico{color:var(--accent);display:flex}
    .title-actions{margin-left:auto;display:flex;gap:4px}
    .win-content{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
    .rz{position:absolute;z-index:20}
    .rz.n{top:0;left:8px;right:8px;height:5px;cursor:ns-resize}
    .rz.s{bottom:0;left:8px;right:8px;height:5px;cursor:ns-resize}
    .rz.e{right:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
    .rz.w{left:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
    .rz.ne{right:0;top:0;width:12px;height:12px;cursor:nesw-resize}
    .rz.nw{left:0;top:0;width:12px;height:12px;cursor:nwse-resize}
    .rz.se{right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}
    .rz.sw{left:0;bottom:0;width:12px;height:12px;cursor:nesw-resize}
    .snap-preview{position:absolute;border:2px solid var(--accent);background:var(--accent-soft);border-radius:14px;z-index:1100;pointer-events:none;animation:pop .12s ease}
    .statusline{height:26px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;border-top:1px solid var(--stroke);font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}

    /* Dock */
    .dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:1250;display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:22px;max-width:calc(100vw - 24px)}
    .dock-divider{width:1px;height:30px;background:var(--stroke);margin:0 3px}
    .dock-app{position:relative;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:var(--muted);transition:transform .18s cubic-bezier(.2,.9,.25,1),background .18s,color .18s}
    .dock-app:hover{transform:translateY(-9px) scale(1.14);background:var(--panel-hover);color:var(--text)}
    .dock-app.active{color:var(--accent);background:var(--accent-soft);border-color:var(--stroke)}
    .dock-app::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(4px);padding:5px 8px;border-radius:7px;background:var(--glass-strong);border:1px solid var(--stroke);font-size:10px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:.16s}
    .dock-app:hover::after{opacity:1;transform:translateX(-50%)}
    .run-dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
    .dock-clock{padding:0 10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-align:right;line-height:1.35}

    /* Command palette */
    .overlay{position:fixed;inset:0;z-index:9000;background:rgba(3,4,10,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;animation:fade .16s ease}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    .palette{width:min(660px,94vw);border-radius:20px;overflow:hidden;animation:pop .2s ease}
    .palette-input{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--stroke)}
    .palette-input input{border:0;background:transparent;box-shadow:none;font-size:17px;padding:0}
    .palette-input input:focus{box-shadow:none;border:0}
    .palette-list{max-height:390px;overflow:auto;padding:8px}
    .palette-group{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800;padding:9px 10px 5px}
    .palette-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;cursor:pointer;border:1px solid transparent}
    .palette-item:hover,.palette-item.sel{background:var(--accent-soft);border-color:var(--stroke)}
    .palette-item .pi-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--panel);color:var(--accent)}
    .kbd{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 6px;border-radius:5px;border:1px solid var(--stroke);background:var(--panel);color:var(--muted)}

    /* Context menu, toasts, boot, lock */
    .context-menu{position:fixed;z-index:9200;min-width:222px;padding:7px;border-radius:14px;animation:pop .14s ease}
    .ctx-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:12px;cursor:pointer}
    .ctx-item:hover{background:var(--accent-soft);color:var(--accent)}
    .ctx-sep{height:1px;background:var(--stroke);margin:5px}
    .toast-stack{position:fixed;right:18px;top:52px;z-index:9500;width:300px;display:flex;flex-direction:column;gap:9px;pointer-events:none}
    .toast{pointer-events:auto;padding:12px;border-radius:14px;display:flex;gap:10px;animation:toastIn .28s cubic-bezier(.2,.9,.25,1);position:relative;overflow:hidden}
    .toast::after{content:"";position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:toastBar 4s linear forwards}
    @keyframes toastIn{from{opacity:0;transform:translateX(30px) scale(.96)}to{opacity:1;transform:none}}
    @keyframes toastBar{from{width:100%}to{width:0}}
    .boot{position:fixed;inset:0;z-index:10000;background:#04050b;display:grid;place-items:center;cursor:pointer}
    .boot-inner{width:min(380px,86vw);text-align:center}
    .boot-logo{width:72px;height:72px;margin:0 auto 24px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 70px var(--accent-soft);animation:breathe 2s ease-in-out infinite}
    @keyframes breathe{50%{transform:scale(1.08);filter:brightness(1.2)}}
    .boot-bar{height:3px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin:22px 0 12px}
    .boot-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:load 1.9s cubic-bezier(.3,.1,.2,1) forwards}
    @keyframes load{from{width:2%}to{width:100%}}
    .boot-log{font-family:'JetBrains Mono',monospace;font-size:10px;color:#64748b;height:16px}

    .avatar{width:76px;height:76px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 16px 50px var(--accent-soft)}
    .drop-overlay{position:absolute;inset:16px;z-index:8000;border:2px dashed var(--accent);border-radius:24px;background:rgba(10,12,26,.72);backdrop-filter:blur(8px);display:grid;place-items:center;pointer-events:none}
    .no-anim *{animation:none!important;transition:none!important}
    .desktop.no-blur .topbar,.desktop.no-blur .window,.desktop.no-blur .dock,.desktop.no-blur .glass,.desktop.no-blur .popover{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

    /* Explorer */
    .explorer{display:flex;height:100%;min-height:0}
    .explorer-side{width:186px;flex:none;padding:12px 10px;border-right:1px solid var(--stroke);overflow:auto;background:rgba(0,0,0,.10)}
    .side-label{font-size:9px;letter-spacing:.16em;color:var(--muted);font-weight:800;padding:10px 10px 6px;text-transform:uppercase}
    .side-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:600}
    .side-item:hover{background:var(--panel-hover);color:var(--text)}
    .side-item.active{background:var(--accent-soft);color:var(--accent)}
    .side-item .count{margin-left:auto;font-size:10px;opacity:.7}
    .explorer-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
    .explorer-head{padding:11px 14px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .crumbs{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:120px}
    .crumb{padding:4px 7px;border-radius:7px;cursor:pointer}
    .crumb:hover{background:var(--panel-hover);color:var(--text)}
    .file-area{flex:1;overflow:auto;padding:14px;min-height:0}
    .file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px}
    .file-card{padding:12px 8px;border-radius:14px;border:1px solid var(--stroke);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:.16s;position:relative;min-height:120px}
    .file-card:hover{transform:translateY(-3px);background:var(--panel-hover);border-color:var(--stroke-strong)}
    .file-card.sel{border-color:var(--accent);background:var(--accent-soft)}
    .file-card .thumb{width:60px;height:52px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent-soft),rgba(0,0,0,.08));color:var(--accent);overflow:hidden}
    .file-card .thumb img{width:100%;height:100%;object-fit:cover}
    .file-card .name{font-size:11px;font-weight:600;text-align:center;word-break:break-word;line-height:1.3}
    .file-card .star{position:absolute;top:6px;right:7px;color:#fbbf24}
    .file-list{display:flex;flex-direction:column;gap:5px}
    .file-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;border:1px solid transparent;cursor:pointer;font-size:12px}
    .file-row:hover{background:var(--panel-hover)}
    .file-row.sel{background:var(--accent-soft);border-color:var(--stroke)}
    .file-row .fi{color:var(--accent);display:flex}
    .file-row .meta{margin-left:auto;color:var(--muted);font-size:10px;font-family:'JetBrains Mono',monospace}
    .inspector{border-top:1px solid var(--stroke);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.08)}
    .inline-new{display:flex;gap:6px;padding:8px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent);margin-bottom:10px}
    .inline-new input{flex:1;padding:6px 9px}

    /* Terminal */
    .terminal{height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(4,7,16,.96),rgba(3,5,12,.98));font-family:'JetBrains Mono',monospace;font-size:12px;min-height:0}
    .term-head{padding:8px 12px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted)}
    .term-body{flex:1;overflow:auto;padding:12px 14px;line-height:1.65;min-height:0;white-space:pre-wrap;word-break:break-word}
    .term-line{border-bottom:1px solid transparent}
    .term-prompt{color:var(--accent2)}.term-path{color:var(--accent)}
    .term-ok{color:#4ade80}.term-warn{color:#fbbf24}.term-err{color:#fb7185}.term-dim{color:#64748b}
    .term-input-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--stroke);background:rgba(255,255,255,.02)}
    .term-input-row input{flex:1;background:transparent;border:0;box-shadow:none;padding:4px 0;color:var(--text)}
    .term-input-row input:focus{border:0;box-shadow:none}

    /* Editor */
    .editor{height:100%;display:flex;flex-direction:column;min-height:0}

    .tab.active{background:var(--panel-hover);color:var(--text)}
    .editor-body{flex:1;display:flex;min-height:0;position:relative}

    .editor-area{flex:1;resize:none;border:0;border-radius:0;background:transparent!important;box-shadow:none!important;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.65;tab-size:2;white-space:pre;overflow:auto;min-height:0}
    .editor-area:focus{border:0;box-shadow:none}
    .editor-area.wrap{white-space:pre-wrap}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

    /* Paint */
    .paint{height:100%;display:flex;flex-direction:column;min-height:0}
    .paint-tools{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--stroke);flex-wrap:wrap}
    .tool{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--stroke);background:var(--panel);color:var(--muted)}
    .tool.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
    .swatch{width:20px;height:20px;border-radius:6px;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
    .swatch.active{outline:2px solid var(--accent);outline-offset:2px}
    .canvas-wrap{flex:1;min-height:0;margin:12px;border-radius:12px;overflow:hidden;border:1px solid var(--stroke);background:linear-gradient(45deg,#1b1f2e 25%,transparent 25%,transparent 75%,#1b1f2e 75%),linear-gradient(45deg,#1b1f2e 25%,#222638 25%,#222638 75%,#1b1f2e 75%);background-size:20px 20px;background-position:0 0,10px 10px}
    .canvas-wrap canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

    /* Calculator, notes, monitor, gallery, settings, about */
    .calc{height:100%;display:flex;flex-direction:column;padding:14px;gap:10px}
    .calc-display{width:100%;text-align:right;padding:14px;border-radius:12px;background:rgba(0,0,0,.16);border:1px solid var(--stroke);font-family:'JetBrains Mono',monospace}
    .calc-display .expr{font-size:11px;color:var(--muted);height:16px;overflow:hidden}
    .calc-display .val{font-size:30px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
    .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;min-height:0}
    .calc-key{border-radius:11px;border:1px solid var(--stroke);background:var(--panel);font-size:14px;font-weight:600;transition:.12s}

    .calc-key.eq{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0}

    .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

    .gallery{height:100%;display:flex;flex-direction:column;min-height:0}

    .settings{height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:18px}
    .set-section{display:flex;flex-direction:column;gap:10px}
    .set-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700}
    .theme-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .theme-card{padding:10px;border-radius:12px;border:1px solid var(--stroke);background:var(--panel);cursor:pointer;text-align:left;font-size:11px;font-weight:600}
    .theme-card.active{border-color:var(--accent);background:var(--accent-soft)}
    .theme-swatch{height:36px;border-radius:8px;margin-bottom:8px}
    .accent-row{display:flex;gap:9px}
    .accent-dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
    .accent-dot.active{border-color:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
    .wall-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .wall-card{height:62px;border-radius:11px;border:1px solid var(--stroke);cursor:pointer;position:relative;overflow:hidden}
    .wall-card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
    .wall-card span{position:absolute;bottom:5px;left:7px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;text-shadow:0 1px 4px #000}
    .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 11px;border-radius:11px;background:var(--panel);border:1px solid var(--stroke)}
    .about{height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
    .about-hero{width:86px;height:86px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 18px 50px var(--accent-soft)}
    .about h1{margin:0;font-family:'Space Grotesk',sans-serif;font-size:26px;letter-spacing:.06em}
    .spec{width:100%;display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--stroke);font-size:12px}
    .spec span:first-child{color:var(--muted)}

    /* Responsive */
    @media (max-width:820px){
      .widget-stack{display:none}.topbar-center{display:none}.hide-sm{display:none!important}.desk-icons{display:none}
      .explorer-side{width:140px}.stat-grid{grid-template-columns:repeat(2,1fr)}
    }
    @media (max-width:600px){

      .explorer-side{display:none}.toast-stack{right:8px;top:48px;width:calc(100vw - 16px)}
      .popover.right,.popover.left{right:8px;left:8px;width:auto}.theme-cards,.wall-cards{grid-template-columns:repeat(2,1fr)}
    }
  </style>

  /* ---------- Registry & helpers ---------- */
  const APPS=[
    {id:'explorer',name:'Explorer',icon:'files',w:840,h:540},
    {id:'terminal',name:'Terminal',icon:'terminal',w:700,h:440},
    {id:'editor',name:'Code Editor',icon:'editor',w:760,h:520},
    {id:'paint',name:'Paint Studio',icon:'paint',w:780,h:540},
    {id:'gallery',name:'Gallery',icon:'gallery',w:760,h:520},
    {id:'notes',name:'Notes',icon:'notes',w:620,h:460},
    {id:'calc',name:'Calculator',icon:'calc',w:330,h:470},
    {id:'monitor',name:'System Monitor',icon:'activity',w:680,h:500},
    {id:'settings',name:'Settings',icon:'settings',w:640,h:540},
    {id:'about',name:'About',icon:'info',w:480,h:480}
  ];
  const appById=id=>APPS.find(a=>a.id===id)||APPS[0];
  const uid=(p='id')=>p+'-'+Math.random().toString(36).slice(2,10);
  const formatDate=t=>{try{return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch(e){return '—'}};

  function artUrl(a,b,title){
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient><radialGradient id="r"><stop stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="900" height="560" fill="url(#g)"/><circle cx="260" cy="190" r="190" fill="url(#r)"/><circle cx="690" cy="420" r="240" fill="url(#r)" opacity=".5"/><path d="M0 420 Q220 300 450 410 T900 350 V560 H0Z" fill="#000" opacity=".18"/><text x="44" y="510" font-family="sans-serif" font-size="26" font-weight="700" fill="#fff" opacity=".85">'+title+'</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  }
  function defaultState(){
    const t=Date.now();
    const f=(id,name,type,content,extra={})=>({id,name,type,content:content||'',folder:'root',created:t,modified:t,starred:false,trashed:false,...extra});
    return {
      version:4,
      settings:{theme:'dark',accent:'violet',wallpaper:'nebula',customWallpaper:null,animations:true,showIcons:true,blur:true,brightness:100,iconPositions:{}},
      files:[
        f('f-welcome','welcome.md','text','# Welcome to AETHER OS\n\nYou are inside a full desktop environment running in a single HTML file.\n\n## Shortcuts\n- Ctrl / Cmd + K  — command palette\n- Ctrl / Cmd + N  — new note\n- Ctrl / Cmd + S  — save in editor\n- Alt + Tab       — cycle windows\n- Esc             — close overlays / top window\n\nRight-click the desktop for quick actions. Drag files here to import them.\n',{starred:true}),
        f('f-folder','Field Notes','folder','',{starred:true}),
        f('f-ideas','ideas.txt','text','01. Build something nobody expects.\n02. Make every pixel intentional.\n03. Ship it.\n',{folder:'f-folder'}),
        f('f-art1','nebula-study.svg','image',artUrl('#6d28d9','#0891b2','NEBULA / 01'),{starred:true}),
        f('f-art2','aurora-study.svg','image',artUrl('#065f46','#4f46e5','AURORA / 02')),
        f('f-note','Quick idea','note','Design the control center like a cockpit, not a settings page.',{color:'#8b5cf6'})
      ],
      windows:[],
      favorites:['explorer','terminal','editor','paint','notes','settings'],
      iconPositions:{},
      notifications:[]
    };
  }
  function normalize(s){
    const d=defaultState();
    const out={...d,...s};
    out.settings={...d.settings,...(s.settings||{})};
    out.files=Array.isArray(s.files)?s.files.map(f=>({...f,folder:f.folder||'root',created:f.created||Date.now(),modified:f.modified||Date.now(),starred:!!f.starred,trashed:!!f.trashed})):d.files;
    out.windows=Array.isArray(s.windows)?s.windows.filter(w=>w&&w.app):[];
    out.favorites=Array.isArray(s.favorites)?s.favorites:d.favorites;
    out.iconPositions=s.iconPositions||{};
    out.notifications=[];
    return out;
  }
  function loadState(){
    try{
      const raw=localStorage.getItem(KEY);
      if(raw){const s=JSON.parse(raw);if(s&&s.version===4)return normalize(s)}
      const old=localStorage.getItem(LEGACY_KEY);
      if(old){
        JSON.parse(old);
        const d=defaultState();
        d.notifications=[{id:uid('n'),title:'Welcome to AETHER OS',body:'Your workspace has been upgraded.',icon:'sparkles',ts:Date.now()}];
        return d;
      }
    }catch(e){}
    return defaultState();
  }
  function saveState(s){try{localStorage.setItem(KEY,JSON.stringify({...s,notifications:[]}))}catch(e){console.warn('AETHER: storage full',e)}}
  function readFileAsDataURL(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)})}
  function readFileAsText(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsText(file)})}
  function typeFromFile(file){
    if(file.type.startsWith('image/'))return 'image';
    if(file.type.startsWith('audio/'))return 'audio';
    if(file.type.startsWith('video/'))return 'video';
    return 'text';
  }
  function fileIcon(f){
    if(f.type==='folder')return 'folder';
    if(f.type==='image')return 'image';
    if(f.type==='audio')return 'music';
    if(f.type==='video')return 'video';
    if(f.type==='note')return 'notes';
    return 'fileText';
  }
  /* ---------- OS context ---------- */
  const OSContext=createContext(null);
  const useOS=()=>useContext(OSContext);

  function OSProvider({children}){
    const [state,setState]=useState(loadState);
    const zRef=useRef(Date.now());
    useEffect(()=>{const t=setTimeout(()=>saveState(state),300);return()=>clearTimeout(t)},[state]);
    useEffect(()=>{
      document.documentElement.dataset.theme=state.settings.theme;
      document.documentElement.dataset.accent=state.settings.accent;
      document.documentElement.classList.toggle('no-anim',!state.settings.animations);
    },[state.settings.theme,state.settings.accent,state.settings.animations]);

    const notify=useCallback((title,body='',icon='sparkles')=>{
      const n={id:uid('n'),title,body,icon,ts:Date.now()};
      setState(s=>({...s,notifications:[...s.notifications,n].slice(-8)}));
      setTimeout(()=>setState(s=>({...s,notifications:s.notifications.filter(x=>x.id!==n.id)})),4200);
    },[]);
    const z=()=>{zRef.current+=1;return zRef.current};

    const openApp=useCallback((appId,opts={})=>{
      const a=appById(appId);
      setState(s=>{
        const count=s.windows.length;
        const w={id:opts.id||uid('w'),app:appId,title:opts.title||a.name,
          x:opts.x!=null?opts.x:Math.min(90+count*26,Math.max(20,window.innerWidth-380)),
          y:opts.y!=null?opts.y:Math.min(64+count*22,Math.max(50,window.innerHeight-260)),
          w:opts.w||a.w,h:opts.h||a.h,z:z(),minimized:false,maximized:false,prev:null,fileId:opts.fileId||null};
        return {...s,windows:[...s.windows.filter(x=>x.id!==w.id),w]};
      });
    },[]);

    const openFile=useCallback(file=>{
      if(file.type==='folder'){notify('Folder',file.name,'folder');return}
      if(file.type==='image')openApp('gallery',{title:file.name,fileId:file.id,w:820,h:560});
      else if(file.type==='audio'||file.type==='video')openApp('viewer',{title:file.name,fileId:file.id,w:640,h:460});
      else if(file.type==='note')openApp('notes',{title:'Notes',fileId:file.id});
      else openApp('editor',{title:file.name,fileId:file.id});
    },[openApp,notify]);

    const api={
      state,openApp,openFile,notify,
      updateWindow:(id,patch)=>setState(s=>({...s,windows:s.windows.map(w=>w.id===id?{...w,...patch}:w)})),
      closeWindow:id=>setState(s=>({...s,windows:s.windows.filter(w=>w.id!==id)})),
      focusWindow:id=>setState(s=>({...s,windows:s.windows.map(w=>w.id===id?{...w,z:z(),minimized:false}:w)})),
      minimizeWindow:id=>setState(s=>({...s,windows:s.windows.map(w=>w.id===id?{...w,minimized:true}:w)})),
      toggleMaximize:id=>setState(s=>({...s,windows:s.windows.map(w=>{
        if(w.id!==id)return w;
        if(w.maximized)return {...w,...(w.prev||{}),maximized:false,prev:null};
        return {...w,prev:{x:w.x,y:w.y,w:w.w,h:w.h},x:0,y:TOP,w:window.innerWidth,h:window.innerHeight-TOP-92,maximized:true};
      })})),
      snapWindow:(id,side)=>setState(s=>({...s,windows:s.windows.map(w=>{
        if(w.id!==id)return w;
        const H=window.innerHeight-TOP-92,W=window.innerWidth;
        const geo=side==='left'?{x:0,y:TOP,w:W/2,h:H}:side==='right'?{x:W/2,y:TOP,w:W/2,h:H}:side==='top'?{x:0,y:TOP,w:W,h:H}:{x:W*.08,y:TOP+24,w:W*.84,h:H*.86};
        return {...w,...geo,maximized:false,prev:null};
      })})),
      createFile:file=>{setState(s=>({...s,files:[...s.files,{id:uid('f'),folder:'root',created:Date.now(),modified:Date.now(),starred:false,trashed:false,...file}]}));notify('Created',file.name||'New file',file.type==='folder'?'folder':'fileText')},
      updateFile:(id,patch)=>setState(s=>({...s,files:s.files.map(f=>f.id===id?{...f,...patch,modified:Date.now()}:f)})),
      deleteFile:id=>{setState(s=>({...s,files:s.files.map(f=>f.id===id?{...f,trashed:true}:f)}));notify('Moved to Trash','Restorable from Trash','trash')},
      restoreFile:id=>setState(s=>({...s,files:s.files.map(f=>f.id===id?{...f,trashed:false}:f)})),
      purgeFile:id=>setState(s=>({...s,files:s.files.filter(f=>f.id!==id)})),
      emptyTrash:()=>{setState(s=>({...s,files:s.files.filter(f=>!f.trashed)}));notify('Trash emptied','All items permanently removed','trash')},
      setSetting:patch=>setState(s=>({...s,settings:{...s.settings,...patch}})),
      clearNotifications:()=>setState(s=>({...s,notifications:[]})),
      toggleFavorite:appId=>setState(s=>({...s,favorites:s.favorites.includes(appId)?s.favorites.filter(x=>x!==appId):[...s.favorites,appId]})),
      importFiles:async files=>{
        for(const file of Array.from(files||[])){
          try{
            const type=typeFromFile(file);
            const content=type==='text'?await readFileAsText(file):await readFileAsDataURL(file);
            setState(s=>({...s,files:[...s.files,{id:uid('f'),name:file.name,type,content,folder:'root',created:Date.now(),modified:Date.now(),starred:false,trashed:false}]}));
            notify('Imported',file.name,'upload');
          }catch(e){notify('Import failed',file.name,'close')}
        }
      },
      downloadFile:f=>{
        const text=f.type==='text'||f.type==='note';
        const href=text?URL.createObjectURL(new Blob([f.content],{type:'text/plain'})):f.content;
        const a=document.createElement('a');a.href=href;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
        if(text)setTimeout(()=>URL.revokeObjectURL(href),1000);
      },
      replaceState:next=>setState(normalize({...next,version:4})),
      topWindow:()=>state.windows.filter(w=>!w.minimized).reduce((a,w)=>!a||w.z>a.z?w:a,null)
    };
    return <OSContext.Provider value={api}>{children}</OSContext.Provider>;
  }

  /* ---------- Reusable UI ---------- */
  function ToolButton({icon,title,onClick,active,disabled}){
    return <button className={'btn icon '+(active?'primary':'')} title={title} onClick={onClick} disabled={disabled} style={{opacity:disabled?.4:1}}><Icon name={icon} size={15}/></button>;
  }
  function Toggle({checked,onChange,label,desc}){
    return <div className="set-row"><div><div style={{fontSize:12,fontWeight:600}}>{label}</div>{desc&&<div className="tiny muted">{desc}</div>}</div><button className={'switch '+(checked?'on':'')} onClick={()=>onChange(!checked)} aria-label={label}/></div>;
  }
  function Sparkline({data,color,height=44}){
    const max=Math.max(...data,10),min=Math.min(...data,0);
    const pts=data.map((v,i)=>`${(i/(data.length-1||1))*100},${height-4-((v-min)/((max-min)||1))*(height-10)}`).join(' ');
    return <svg className="spark" viewBox={`0 0 100 ${height}`} preserveAspectRatio="none"><polyline points={pts} fill="none" stroke={color||'var(--accent)'} strokeWidth="1.6" vectorEffect="non-scaling-stroke"/></svg>;
  }

  /* ---------- Window frame ---------- */
  function WindowFrame({win,children}){
    const {updateWindow,closeWindow,minimizeWindow,toggleMaximize,focusWindow,snapWindow,state}=useOS();
    const gesture=useRef(null);
    const [snapHint,setSnapHint]=useState(null);
    const active=state.windows.filter(w=>!w.minimized).reduce((a,w)=>!a||w.z>a.z?w:a,null)?.id===win.id;
    const a=appById(win.app);

    useEffect(()=>{
      function move(e){
        const g=gesture.current;if(!g)return;
        if(g.kind==='drag'){
          let x=g.x+e.clientX-g.sx,y=g.y+e.clientY-g.sy;
          x=Math.max(-g.w+90,Math.min(x,window.innerWidth-90));
          y=Math.max(0,Math.min(y,window.innerHeight-50));
          updateWindow(g.id,{x,y});
          const side=e.clientX<9?'left':e.clientX>window.innerWidth-9?'right':e.clientY<9?'top':null;
          setSnapHint(side);
        }else{
          const dx=e.clientX-g.sx,dy=e.clientY-g.sy;
          let {x,y,w,h}=g;
          if(g.dir.includes('e'))w=Math.max(320,g.w+dx);
          if(g.dir.includes('s'))h=Math.max(200,g.h+dy);
          if(g.dir.includes('w')){w=Math.max(320,g.w-dx);x=g.x+(g.w-w)}
          if(g.dir.includes('n')){h=Math.max(200,g.h-dy);y=g.y+(g.h-h)}
          updateWindow(g.id,{x,y,w,h});
        }
      }
      function up(){
        const g=gesture.current;if(!g)return;
        if(g.kind==='drag'&&snapHint)snapWindow(g.id,snapHint);
        gesture.current=null;setSnapHint(null);document.body.style.userSelect='';
      }
      window.addEventListener('pointermove',move);
      window.addEventListener('pointerup',up);
      return()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};
    },[snapHint]);

    function startDrag(e){
      if(e.target.closest('.light')||e.target.closest('.title-actions')||win.maximized)return;
      focusWindow(win.id);
      gesture.current={kind:'drag',id:win.id,sx:e.clientX,sy:e.clientY,x:win.x,y:win.y,w:win.w,h:win.h};
      document.body.style.userSelect='none';
    }
    function startResize(e,dir){
      e.stopPropagation();focusWindow(win.id);
      gesture.current={kind:'resize',id:win.id,dir,sx:e.clientX,sy:e.clientY,x:win.x,y:win.y,w:win.w,h:win.h};
      document.body.style.userSelect='none';
    }
    const hintStyle=snapHint==='left'?{left:0,top:TOP,width:'50%',height:window.innerHeight-TOP-92}:snapHint==='right'?{right:0,top:TOP,width:'50%',height:window.innerHeight-TOP-92}:snapHint==='top'?{left:0,top:TOP,width:'100%',height:window.innerHeight-TOP-92}:null;

    return <>
      {snapHint&&hintStyle&&<div className="snap-preview" style={hintStyle}/>}
      <div className={'window '+(win.minimized?'minimized ':'')+(win.maximized?'maximized ':'')+(active?'active':'')}
        style={{left:win.x,top:win.y,width:win.w,height:win.h,zIndex:win.z}}
        onPointerDown={()=>{if(!active)focusWindow(win.id)}}>
        <div className="titlebar" onPointerDown={startDrag} onDoubleClick={()=>toggleMaximize(win.id)}>
          <div className="lights">
            <span className="light close" title="Close" onPointerDown={e=>e.stopPropagation()} onClick={()=>closeWindow(win.id)}>×</span>
            <span className="light min" title="Minimize" onPointerDown={e=>e.stopPropagation()} onClick={()=>minimizeWindow(win.id)}>−</span>
            <span className="light max" title="Maximize" onPointerDown={e=>e.stopPropagation()} onClick={()=>toggleMaximize(win.id)}>{win.maximized?'❐':'+'}</span>
          </div>
          <div className="title-text"><span className="app-ico"><Icon name={a.icon} size={14}/></span>{win.title}</div>
          <div className="title-actions">
            {!win.maximized&&<>
              <button className="btn ghost icon" title="Snap left" onPointerDown={e=>e.stopPropagation()} onClick={()=>snapWindow(win.id,'left')}><Icon name="left" size={13}/></button>
              <button className="btn ghost icon" title="Snap right" onPointerDown={e=>e.stopPropagation()} onClick={()=>snapWindow(win.id,'right')}><Icon name="right" size={13}/></button>
            </>}
          </div>
        </div>
        <div className="win-content">{children}</div>
        {!win.maximized&&['n','s','e','w','ne','nw','se','sw'].map(d=><div key={d} className={'rz '+d} onPointerDown={e=>startResize(e,d)}/>)}
      </div>
    </>;
  }
  /* ---------- Explorer ---------- */
  function ExplorerApp({win}){
    const {state,createFile,updateFile,deleteFile,restoreFile,purgeFile,emptyTrash,downloadFile,openFile,openApp}=useOS();
    const [path,setPath]=useState(['root']);
    const [view,setView]=useState('grid');
    const [query,setQuery]=useState('');
    const [selected,setSelected]=useState(null);
    const [sort,setSort]=useState('name');
    const [newItem,setNewItem]=useState(null);
    const [rename,setRename]=useState(null);
    const cur=path[path.length-1];
    const inTrash=cur==='trash';
    const live=state.files.filter(f=>!f.trashed);
    let items;
    if(query.trim())items=state.files.filter(f=>inTrash?f.trashed:!f.trashed).filter(f=>f.name.toLowerCase().includes(query.toLowerCase()));
    else items=state.files.filter(f=>(f.folder||'root')===cur&&(inTrash?f.trashed:!f.trashed));
    items=[...items].sort((a,b)=>{
      if(sort==='date')return b.modified-a.modified;
      if(sort==='type')return a.type.localeCompare(b.type);
      if(sort==='size')return (b.content||'').length-(a.content||'').length;
      return a.name.localeCompare(b.name);

      const name=(newItem?.name||'').trim();if(!name)return setNewItem(null);
      createFile({name,type:newItem.type,content:'',color:newItem.type==='note'?'#8b5cf6':undefined});
      setNewItem(null);
    }
    function openItem(f){
      if(f.type==='folder'){setPath([...path,f.id]);setQuery('');setSelected(null)}

    return <div className="explorer">
      <aside className="explorer-side">
        <div className="side-label">Locations</div>
        <div className={'side-item '+(cur==='root'&&!query?'active':'')} onClick={()=>{setPath(['root']);setQuery('')}}><Icon name="home" size={15}/>Home<span className="count">{live.filter(f=>(f.folder||'root')==='root').length}</span></div>
        <div className={'side-item '+(query?'active':'')} onClick={()=>document.getElementById('exp-search-'+win.id)?.focus()}><Icon name="search" size={15}/>Search</div>
        <div className={'side-item '+(inTrash?'active':'')} onClick={()=>{setPath(['root','trash']);setQuery('')}}><Icon name="trash" size={15}/>Trash<span className="count">{state.files.filter(f=>f.trashed).length}</span></div>
        <div className="side-label">Library</div>
        <div className="side-item" onClick={()=>{setQuery('');setPath(['root']);setSort('date')}}><Icon name="clock" size={15}/>Recent</div>
        <div className="side-item" onClick={()=>{setQuery('');setPath(['root']);setSort('name')}}><Icon name="star" size={15}/>All files<span className="count">{live.length}</span></div>
        <div className="side-label">Folders</div>
        {live.filter(f=>f.type==='folder'&&(f.folder||'root')==='root').map(f=><div key={f.id} className="side-item" onClick={()=>{setPath(['root',f.id]);setQuery('')}}><Icon name="folder" size={15}/>{f.name}</div>)}
        <div className="sep"/>
        <div className="side-item" onClick={()=>openApp('settings')}><Icon name="settings" size={15}/>Preferences</div>
      </aside>
      <main className="explorer-main">
        <div className="explorer-head">
          <button className="btn icon" onClick={()=>path.length>1&&setPath(path.slice(0,-1))} disabled={path.length<2}><Icon name="left" size={14}/></button>
          <div className="crumbs">{crumbs}</div>
          <input id={'exp-search-'+win.id} placeholder="Search files…" value={query} onChange={e=>setQuery(e.target.value)} style={{width:150,padding:'6px 9px',fontSize:11}}/>
          <select value={sort} onChange={e=>setSort(e.target.value)} style={{padding:'6px 8px',fontSize:11}}><option value="name">Name</option><option value="date">Modified</option><option value="type">Type</option><option value="size">Size</option></select>
          <button className="btn icon" title={view==='grid'?'List view':'Grid view'} onClick={()=>setView(view==='grid'?'list':'grid')}><Icon name={view==='grid'?'list':'grid'} size={14}/></button>
          <button className="btn icon" title="Refresh" onClick={()=>{setQuery('');setSelected(null)}}><Icon name="refresh" size={14}/></button>
        </div>
        <div className="file-area">
          {!inTrash&&!query&&<div className="row" style={{marginBottom:12}}>
            <button className="btn" onClick={()=>setNewItem({type:'folder',name:'New Folder'})}><Icon name="folderPlus" size={14}/>New folder</button>
            <button className="btn" onClick={()=>setNewItem({type:'text',name:'untitled.txt'})}><Icon name="fileText" size={14}/>New file</button>
            <button className="btn" onClick={()=>setNewItem({type:'note',name:'Untitled note'})}><Icon name="notes" size={14}/>New note</button>
            <button className="btn" onClick={()=>document.getElementById('global-file-input')?.click()}><Icon name="upload" size={14}/>Import</button>
            {inTrash&&<button className="btn danger" onClick={()=>{if(confirm('Permanently delete everything in Trash?'))emptyTrash()}}>Empty</button>}
          </div>}
          {newItem&&<div className="inline-new"><Icon name={fileIcon({type:newItem.type})} size={16}/><input autoFocus value={newItem.name} onChange={e=>setNewItem({...newItem,name:e.target.value})} onKeyDown={e=>{if(e.key==='Enter')addItem();if(e.key==='Escape')setNewItem(null)}}/><button className="btn primary" onClick={addItem}>Create</button><button className="btn ghost" onClick={()=>setNewItem(null)}><Icon name="close" size={13}/></button></div>}
          {items.length===0?<div className="empty"><div><div className="big"><Icon name={inTrash?'trash':'files'} size={28}/></div><div style={{fontWeight:700,color:'var(--text)'}}>{inTrash?'Trash is empty':'Nothing here yet'}</div><div className="tiny">Create a file or drop one onto the desktop</div></div></div>
          :view==='grid'?<div className="file-grid">{items.map(f=><div key={f.id} className={'file-card '+(selected===f.id?'sel':'')} onClick={()=>setSelected(f.id)} onDoubleClick={()=>openItem(f)}>
              {f.starred&&<span className="star"><Icon name="starFill" size={13}/></span>}
              <div className="thumb">{f.type==='image'?<img src={f.content} alt=""/>:<Icon name={fileIcon(f)} size={28}/>}</div>
              <div className="name">{f.name}</div><div className="tiny muted">{f.type}</div>
            </div>)}</div>
          :<div className="file-list">{items.map(f=><div key={f.id} className={'file-row '+(selected===f.id?'sel':'')} onClick={()=>setSelected(f.id)} onDoubleClick={()=>openItem(f)}>
              <span className="fi"><Icon name={fileIcon(f)} size={17}/></span><span className="grow">{f.name}</span>
              {f.starred&&<Icon name="starFill" size={12}/>}<span className="meta">{formatDate(f.modified)}</span><span className="tiny muted">{f.type}</span>
            </div>)}</div>}
        </div>
        {selectedFile&&<div className="inspector">
          <Icon name={fileIcon(selectedFile)} size={17}/><b className="tiny">{selectedFile.name}</b><span className="pill">{selectedFile.type}</span><span className="tiny muted">Modified {formatDate(selectedFile.modified)}</span>
          <div className="grow"/>
          {inTrash?<>
            <button className="btn" onClick={()=>restoreFile(selectedFile.id)}><Icon name="reset" size={13}/>Restore</button>
            <button className="btn danger" onClick={()=>purgeFile(selectedFile.id)}><Icon name="trash" size={13}/>Delete forever</button>
          </>:<>
            <button className="btn" onClick={()=>openItem(selectedFile)}><Icon name="eye" size={13}/>Open</button>
            <button className="btn icon" title="Star" onClick={()=>updateFile(selectedFile.id,{starred:!selectedFile.starred})}>{selectedFile.starred?<Icon name="starFill" size={14}/>:<Icon name="star" size={14}/>}</button>
            <button className="btn icon" title="Rename" onClick={()=>setRename(selectedFile.id)}><Icon name="edit" size={14}/></button>
            {selectedFile.type!=='folder'&&<button className="btn icon" title="Download" onClick={()=>downloadFile(selectedFile)}><Icon name="download" size={14}/></button>}
            <button className="btn danger icon" title="Trash" onClick={()=>deleteFile(selectedFile.id)}><Icon name="trash" size={14}/></button>
          </>}
        </div>}
        {rename&&(()=>{const f=state.files.find(x=>x.id===rename);return f?<RenameDialog file={f} onClose={()=>setRename(null)}/>:null})()}
      </main>
    </div>;
  }
  function RenameDialog({file,onClose}){

  /* ---------- Terminal ---------- */
  function TerminalApp(){
    const {state,createFile,updateFile,deleteFile,setSetting,openApp}=useOS();
    const [lines,setLines]=useState([{t:'AETHER Shell 4.0 — type "help" to begin.',c:'term-dim'}]);
    const [cmd,setCmd]=useState('');
    const [history,setHistory]=useState([]);
    const [hIdx,setHIdx]=useState(-1);
    const bodyRef=useRef();
    useEffect(()=>{if(bodyRef.current)bodyRef.current.scrollTop=bodyRef.current.scrollHeight},[lines]);
    const out=(t,c='')=>setLines(l=>[...l,{t:String(t),c}]);
    function run(raw){
      const input=raw.trim();if(!input)return;
      out('visitor@aether:~$ '+input,'term-prompt');
      setHistory(h=>[input,...h]);setHIdx(-1);setCmd('');
      const parts=input.split(/\s+/);const c=parts[0].toLowerCase();const arg=parts.slice(1).join(' ');
      if(c==='help'){
        out('Available commands:','term-ok');
        out('help | ls [-l] | cat <file> | touch <file> | mkdir <dir> | rm <file> | mv <old> <new>');
        out('star <file> | find <text> | open <app> | theme <dark|light|eclipse> | wall <name>');
        out('echo <text> | date | whoami | clear | history | neofetch | export <file>');
      }
      else if(c==='ls'){
        const list=state.files.filter(f=>!f.trashed);
        if(parts[1]==='-l')list.forEach(f=>out((f.starred?'*':' ')+' '+f.type.padEnd(6)+' '+String((f.content||'').length).padStart(6)+'  '+f.name,'term-dim'));
        else out(list.map(f=>f.name+(f.type==='folder'?'/':'')).join('   ')||'(empty)');
      }
      else if(c==='cat'){
        const f=state.files.find(x=>x.name===arg||x.id===arg);
        out(f?(f.type==='text'||f.type==='note'?f.content:'[binary: '+f.type+']'):'cat: no such file','term-err');
      }
      else if(c==='touch'||c==='mkdir'){
        if(!arg)return out(c+': missing name','term-err');
        createFile({name:arg,type:c==='mkdir'?'folder':'text',content:''});out('created '+arg,'term-ok');
      }
      else if(c==='rm'){
        const f=state.files.find(x=>x.name===arg);
        if(f){deleteFile(f.id);out('removed '+arg,'term-ok')}else out('rm: no such file','term-err');
      }
      else if(c==='mv'||c==='rename'){
        const a=parts[1],b=parts[2];const f=state.files.find(x=>x.name===a);
        if(f&&b){updateFile(f.id,{name:b});out(a+' -> '+b,'term-ok')}else out('mv: usage: mv <old> <new>','term-err');
      }
      else if(c==='star'){
        const f=state.files.find(x=>x.name===arg);
        if(f){updateFile(f.id,{starred:!f.starred});out((f.starred?'unstarred ':'starred ')+arg,'term-ok')}else out('not found','term-err');
      }
      else if(c==='find'){
        const r=state.files.filter(f=>f.name.toLowerCase().includes((arg||'').toLowerCase()));
        out(r.length?r.map(f=>f.name).join('\n'):'no matches');
      }
      else if(c==='open'){
        const a=APPS.find(x=>x.id===arg||x.name.toLowerCase()===arg.toLowerCase());
        if(a){openApp(a.id);out('launched '+a.name,'term-ok')}else out('unknown app: '+arg,'term-err');
      }
      else if(c==='theme'){
        if(['dark','light','eclipse'].includes(arg)){setSetting({theme:arg});out('theme set to '+arg,'term-ok')}
        else out('themes: dark, light, eclipse','term-warn');
      }
      else if(c==='wall'){
        if(['nebula','aurora','sunset','ocean','mono'].includes(arg)){setSetting({wallpaper:arg,customWallpaper:null});out('wallpaper set to '+arg,'term-ok')}
        else out('walls: nebula, aurora, sunset, ocean, mono','term-warn');
      }
      else if(c==='echo')out(arg);
      else if(c==='date')out(new Date().toString());
      else if(c==='whoami')out('visitor — trusted operator','term-ok');
      else if(c==='history')out(history.map((h,i)=>(i+1)+'  '+h).join('\n'));
      else if(c==='clear')setLines([]);
      else if(c==='export'){
        const f=state.files.find(x=>x.name===arg);
        if(f){createFile({name:'export-'+Date.now()+'.txt',type:'text',content:JSON.stringify(f,null,2)});out('exported snapshot','term-ok')}else out('not found','term-err');
      }
      else if(c==='neofetch'){
        out('      ▄▀▄   AETHER OS '+VERSION,'term-ok');out('     ▄█▀█▄  ─────────────');out('    ▄█▀ ▀█▄ Host: Browser Runtime');
        out('    ▀█▄ ▄█▀ Shell: aether-sh 4.0');out('     ▀█▄█▀  DE: Aether Compositor');
        out('      ▀▀   Files: '+state.files.length+'  Windows: '+state.windows.length);
      }
      else out('command not found: '+c+'. Try "help".','term-err');
    }
    return <div className="terminal">
      <div className="term-head"><span className="status-dot"/><span>aether-sh</span><span className="grow"/><span>{history.length} commands</span><button className="btn ghost icon" onClick={()=>setLines([])} title="Clear"><Icon name="trash" size={13}/></button></div>
      <div className="term-body mono" ref={bodyRef} onClick={()=>document.getElementById('term-input')?.focus()}>
        {lines.map((l,i)=><div key={i} className={'term-line '+l.c}>{l.t||'\u00a0'}</div>)}
      </div>
      <div className="term-input-row"><span className="term-path mono">visitor@aether:~$</span><input id="term-input" autoComplete="off" spellCheck="false" value={cmd} onChange={e=>setCmd(e.target.value)} onKeyDown={e=>{
        if(e.key==='Enter')run(cmd);
        else if(e.key==='ArrowUp'){e.preventDefault();const i=Math.min(hIdx+1,history.length-1);if(i>=0){setHIdx(i);setCmd(history[i])}}
        else if(e.key==='ArrowDown'){e.preventDefault();const i=hIdx-1;setHIdx(i);setCmd(i>=0?history[i]:'')}
        else if(e.key==='Tab'){e.preventDefault();const m=APPS.map(a=>a.id).find(x=>x.startsWith(cmd));if(m)setCmd(m)}
      }}/></div>
    </div>;
  }

  /* ---------- Code editor ---------- */
  function EditorApp({win}){
    const {state,updateFile,notify,downloadFile}=useOS();
    const file=state.files.find(f=>f.id===win.fileId);
    const [content,setContent]=useState(file?.content||'');
    const [wrap,setWrap]=useState(true);
    const [font,setFont]=useState(12);
    const [dirty,setDirty]=useState(false);
    const [caret,setCaret]=useState({l:1,c:1});
    const area=useRef();const gutter=useRef();
    useEffect(()=>{setContent(file?.content||'');setDirty(false)},[win.fileId]);
    const isTop=state.windows.filter(w=>!w.minimized).reduce((a,w)=>!a||w.z>a.z?w:a,null)?.id===win.id;
    const save=useCallback(()=>{
      if(!file)return notify('Nothing to save','Open a file first','save');
      updateFile(file.id,{content});setDirty(false);notify('File saved',file.name,'save');
    },[file,content]);
    useEffect(()=>{
      function key(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&isTop){e.preventDefault();save()}}
      window.addEventListener('keydown',key);return()=>window.removeEventListener('keydown',key);
    },[save,isTop]);
    function updateCaret(){
      const p=area.current?.selectionStart||0;const before=content.slice(0,p).split('\n');
      setCaret({l:before.length,c:before[before.length-1].length+1});
    }
    function insertTab(e){
      if(e.key!=='Tab')return;e.preventDefault();
      const el=e.target,s=el.selectionStart,t=el.selectionEnd;
      const next=content.slice(0,s)+'  '+content.slice(t);setContent(next);setDirty(true);
      requestAnimationFrame(()=>{el.selectionStart=el.selectionEnd=s+2});
    }
    const lines=content.split('\n');
    return <div className="editor">
      <div className="tabs"><div className="tab active"><span className="dot"/>{file?file.name:'untitled'}</div><div className="grow"/><div className="row" style={{padding:'0 8px'}}>
        <ToolButton icon="save" title="Save (Ctrl+S)" onClick={save}/>
        <ToolButton icon="download" title="Download" onClick={()=>downloadFile({name:file?.name||'untitled.txt',type:'text',content})}/>
        <ToolButton icon="list" title="Word wrap" active={wrap} onClick={()=>setWrap(!wrap)}/>
        <button className="btn icon" title="Font size" onClick={()=>setFont(font>=18?10:font+2)}>{font}px</button>
      </div></div>
      <div className="editor-body">
        <div className="gutter" ref={gutter}>{lines.map((_,i)=><div key={i}>{i+1}</div>)}</div>
        <textarea ref={area} className={'editor-area '+(wrap?'wrap':'')} spellCheck="false" value={content} style={{fontSize:font}} onChange={e=>{setContent(e.target.value);setDirty(true);updateCaret()}} onKeyUp={updateCaret} onClick={updateCaret} onKeyDown={insertTab} onScroll={e=>{if(gutter.current)gutter.current.scrollTop=e.target.scrollTop}}/>
      </div>
      <div className="statusline"><span>{file?file.name:'untitled'}</span><span>{dirty?'● Unsaved':'✓ Saved'}</span><span className="grow"/><span>Ln {caret.l}, Col {caret.c}</span><span>{lines.length} lines</span><span>{content.length} chars</span><span>UTF-8</span></div>
    </div>;
  }

  /* ---------- Paint studio ---------- */
  function PaintApp(){
    const {createFile,notify}=useOS();
    const canvas=useRef();const drawing=useRef(false);const startPt=useRef(null);const snaps=useRef([]);const snapIdx=useRef(-1);
    const [tool,setTool]=useState('brush');const [color,setColor]=useState('#8b5cf6');const [size,setSize]=useState(5);
    const [,force]=useState(0);
    const colors=['#8b5cf6','#22d3ee','#fb7185','#fbbf24','#a3e635','#ffffff','#0f172a','#f472b6'];
    useEffect(()=>{
      const c=canvas.current;if(!c)return;
      const rect=c.getBoundingClientRect();
      const old=document.createElement('canvas');old.width=c.width;old.height=c.height;
      if(old.width&&old.height)old.getContext('2d').drawImage(c,0,0);
      c.width=Math.max(1,Math.floor(rect.width));c.height=Math.max(1,Math.floor(rect.height));
      const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);
      if(old.width&&old.height)ctx.drawImage(old,0,0);
      if(snapIdx.current<0){snaps.current=[c.toDataURL()];snapIdx.current=0}
    },[]);
    function pt(e){const r=canvas.current.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
    function snapshot(){
      const d=canvas.current.toDataURL();
      snaps.current=[...snaps.current.slice(0,snapIdx.current+1),d].slice(-30);
      snapIdx.current=snaps.current.length-1;force(n=>n+1);
    }
    function restore(i){const img=new Image();img.onload=()=>canvas.current.getContext('2d').drawImage(img,0,0);img.src=snaps.current[i]}
    function down(e){
      e.currentTarget.setPointerCapture(e.pointerId);drawing.current=true;startPt.current=pt(e);
      const ctx=canvas.current.getContext('2d');
      ctx.strokeStyle=tool==='eraser'?'#ffffff':color;ctx.fillStyle=ctx.strokeStyle;
      ctx.lineWidth=tool==='eraser'?size*3:size;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(startPt.current.x,startPt.current.y);
      if(tool==='brush'||tool==='eraser'){ctx.lineTo(startPt.current.x+.1,startPt.current.y+.1);ctx.stroke()}
    }
    function move(e){
      if(!drawing.current)return;
      const p=pt(e);const ctx=canvas.current.getContext('2d');const s=startPt.current;
      if(tool==='brush'||tool==='eraser'){ctx.lineTo(p.x,p.y);ctx.stroke();return}
      if(tool==='line'){ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(p.x,p.y);ctx.stroke();return}
      ctx.beginPath();
      if(tool==='square')ctx.rect(s.x,s.y,p.x-s.x,p.y-s.y);
      else if(tool==='circle')ctx.ellipse((s.x+p.x)/2,(s.y+p.y)/2,Math.abs(p.x-s.x)/2,Math.abs(p.y-s.y)/2,0,0,Math.PI*2);
      ctx.stroke();
    }
    function up(){if(!drawing.current)return;drawing.current=false;snapshot()}
    function clear(){const c=canvas.current;const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);snapshot()}
    function save(){const d=canvas.current.toDataURL('image/png');const name='artwork-'+Date.now()+'.png';createFile({name,type:'image',content:d});notify('Artwork saved',name,'paint')}
    return <div className="paint">
      <div className="paint-tools">
        {[['brush','paint','Brush'],['eraser','eraser','Eraser'],['line','line','Line'],['square','square','Rectangle'],['circle','circle','Ellipse']].map(([id,ico,label])=><button key={id} className={'tool '+(tool===id?'active':'')} title={label} onClick={()=>setTool(id)}><Icon name={ico} size={15}/></button>)}
        <div className="dock-divider"/>
        {colors.map(c=><button key={c} className={'swatch '+(color===c?'active':'')} style={{background:c}} onClick={()=>setColor(c)}/>)}
        <input type="color" value={color} onChange={e=>setColor(e.target.value)} style={{width:30,height:26,padding:2}}/>
        <input className="slider" type="range" min="1" max="32" value={size} onChange={e=>setSize(+e.target.value)} style={{width:80}}/>
        <span className="tiny muted mono">{size}px</span>
        <div className="grow"/>
        <ToolButton icon="undo" title="Undo" disabled={snapIdx.current<=0} onClick={()=>{if(snapIdx.current>0){snapIdx.current--;restore(snapIdx.current);force(n=>n+1)}}}/>
        <ToolButton icon="redo" title="Redo" disabled={snapIdx.current>=snaps.current.length-1} onClick={()=>{if(snapIdx.current<snaps.current.length-1){snapIdx.current++;restore(snapIdx.current);force(n=>n+1)}}}/>
        <ToolButton icon="reset" title="Clear canvas" onClick={clear}/>
        <button className="btn primary" onClick={save}><Icon name="save" size={13}/>Save to Files</button>
      </div>
      <div className="canvas-wrap"><canvas ref={canvas} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}/></div>
    </div>;
  }
  /* ---------- Calculator ---------- */
  function evalSafe(s){
    if(!s)return null;
    const clean=s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');
    if(!/^[0-9+\-*/().\s]+$/.test(clean))return null;
    try{const v=Function('"use strict";return ('+clean+')')();return typeof v==='number'&&isFinite(v)?Math.round(v*1e10)/1e10:null}catch(e){return null}
  }
  function CalculatorApp(){
    const [expr,setExpr]=useState('');const [value,setValue]=useState('0');
    const keys=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='];
    function calc(e){
      if(e==='C'){setExpr('');setValue('0');return}
      if(e==='⌫'){const n=expr.slice(0,-1);setExpr(n);const v=evalSafe(n);if(v!==null)setValue(String(v));return}
      if(e==='='){const n=evalSafe(expr);if(n!==null){setValue(String(n));setExpr(String(n))}else setValue('Error');return}
      const map={'÷':'/','×':'*','−':'-'};
      const n=expr+(map[e]||e);setExpr(n);
      const v=evalSafe(n);if(v!==null)setValue(String(v));
    }
    useEffect(()=>{
      function key(e){
        if(/[0-9+\-*/().]/.test(e.key)&&e.key.length===1)calc(e.key);
        else if(e.key==='Enter'||e.key==='=')calc('=');
        else if(e.key==='Backspace')calc('⌫');
        else if(e.key==='Escape')calc('C');
      }
      window.addEventListener('keydown',key);return()=>window.removeEventListener('keydown',key);
    });
    return <div className="calc">
      <div className="calc-display"><div className="expr">{expr||'\u00a0'}</div><div className="val">{value}</div></div>
      <div className="calc-grid">{keys.map(k=><button key={k} className={'calc-key '+(['÷','×','−','+','='].includes(k)?'op ':'')+(k==='='?'eq':'')} onClick={()=>calc(k)}>{k}</button>)}</div>
    </div>;
  }
