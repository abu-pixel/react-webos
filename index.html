      </div>}

      {panel==='notif'&&<div className="popover right glass" style={{width:340,maxHeight:'60vh',overflow:'auto'}}>
        <div className="row"><b style={{fontSize:12}}>Notifications</b><span className="grow"/><button className="btn ghost" onClick={clearNotifications}>Clear all</button></div>
        <div className="sep"/>
        {state.notifications.length?state.notifications.slice().reverse().map(n=><div key={n.id} className="notif-item"><div className="notif-icon"><Icon name={n.icon||'sparkles'} size={15}/></div><div><b style={{fontSize:12}}>{n.title}</b><div className="tiny muted">{n.body}</div></div></div>):<div className="empty" style={{minHeight:120}}><div><Icon name="bell" size={22}/><div className="tiny">All clear</div></div></div>}
      </div>}

      {s.showIcons&&<div className="desk-icons">
        {dockApps.map((a,i)=>{
          const pos=s.iconPositions[a.id]||{x:8+i*92,y:0};
          return <div key={a.id} className={'desk-icon '+(selectedIcon===a.id?'selected ':'')+(dragIcon===a.id?'selected':'')}
            style={{left:pos.x,top:pos.y}} onPointerDown={e=>{setSelectedIcon(a.id);iconGesture.current={id:a.id,sx:e.clientX,sy:e.clientY,moved:false}}}
            onDoubleClick={()=>openApp(a.id)}>
            <div className="ico"><Icon name={a.icon} size={24}/></div><div className="lbl">{a.name}</div>
          </div>;
        })}
      </div>}

      {!context&&<div className="widget-stack">
        <div className="widget glass">
          <div className="widget-title">Chronometer</div>
          <div className="clock-face">
            {Array.from({length:12},(_,i)=><span key={i} className="tick" style={{transform:`rotate(${i*30}deg)`}}/>)}
            <div className="hand h" style={{transform:`rotate(${hours*30+minutes*.5}deg)`}}/>
            <div className="hand m" style={{transform:`rotate(${minutes*6}deg)`}}/>
            <div className="hand s" style={{transform:`rotate(${seconds*6}deg)`}}/>
            <div className="clock-center"/>
          </div>
          <div style={{textAlign:'center'}}><div className="display" style={{fontSize:17,fontWeight:700}}>{time}</div><div className="tiny muted">{date}</div></div>
        </div>
        <div className="widget glass">
          <div className="widget-title">System pulse</div>
          <Sparkline data={Array.from({length:24},(_,i)=>25+Math.sin(i/3+Date.now()/9000)*15+Math.random()*14)}/>
          <div className="metric"><span>CPU load</span><b>{Math.round(18+Math.random()*22)}%</b></div>
          <div className="metric"><span>Memory</span><b>{Math.round(42+Math.random()*8)}%</b></div>
        </div>
        <div className="widget glass">
          <div className="widget-title">Session</div>
          <div className="row"><span className="status-dot"/><span className="tiny">All systems operational</span></div>
          <div className="tiny muted" style={{marginTop:8}}>{state.files.length} files · {state.windows.length} windows</div>
        </div>
      </div>}

      <WindowShell/>

      {dropActive&&<div className="drop-overlay"><div style={{textAlign:'center'}}><Icon name="upload" size={48}/><div className="display" style={{fontSize:20,marginTop:12}}>Drop to import</div><div className="muted tiny">Files are stored locally in your browser</div></div></div>}

      <nav className="dock glass">
        <button className="dock-app" data-tip="Activities" onClick={()=>setPanel(panel==='menu'?null:'menu')}><Icon name="grid" size={20}/></button>
        {dockApps.map(a=><button key={a.id} className={'dock-app '+(running.some(w=>w.app===a.id)?'active':'')} data-tip={a.name} onClick={()=>{
          const w=running.find(x=>x.app===a.id);
          if(w)focusWindow(w.id);else openApp(a.id);
        }}><Icon name={a.icon} size={20}/>{running.some(w=>w.app===a.id)&&<span className="run-dot"/>}</button>)}
        <div className="dock-divider"/>
        {running.filter(w=>!dockApps.some(a=>a.id===w.app)).slice(0,5).map(w=><button key={w.id} className="dock-app active" data-tip={w.title} onClick={()=>focusWindow(w.id)}><Icon name={appById(w.app).icon} size={19}/><span className="run-dot"/></button>)}
        <div className="dock-clock"><div>{time}</div><div className="tiny">{date}</div></div>
      </nav>

      <div className="toast-stack">{state.notifications.slice(-4).reverse().map(n=><div key={n.id} className="toast glass"><div className="notif-icon"><Icon name={n.icon||'sparkles'} size={15}/></div><div className="grow"><b style={{fontSize:12}}>{n.title}</b><div className="tiny muted">{n.body}</div></div></div>)}</div>

      {context&&<div className="context-menu glass" style={{left:context.x,top:context.y}} onClick={e=>e.stopPropagation()}>
        {ctxItems.map((it,i)=>it.sep?<div key={i} className="ctx-sep"/>:<div key={i} className="ctx-item" onClick={()=>{it.run();setContext(null)}}><Icon name={it.icon} size={14}/>{it.label}</div>)}
      </div>}

      <input id="global-file-input" type="file" multiple style={{display:'none'}} onChange={e=>{importFiles(e.target.files);e.target.value=''}}/>
      <input id="global-wall-input" type="file" accept="image/*" style={{display:'none'}} onChange={async e=>{const f=e.target.files[0];if(f){const d=await readFileAsDataURL(f);setSetting({customWallpaper:d});notify('Wallpaper applied',f.name,'image')}e.target.value=''}}/>
    </div>;
  }

  /* ---------- Command palette ---------- */
  function CommandPalette({onClose}){
    const {state,openApp,openFile,createFile,setSetting,emptyTrash,notify,closeWindow}=useOS();
    const [q,setQ]=useState('');const [sel,setSel]=useState(0);
    const entries=useMemo(()=>{
      const list=[];
      APPS.forEach(a=>list.push({key:'app-'+a.id,group:'Applications',label:a.name,sub:a.id,icon:a.icon,run:()=>openApp(a.id)}));
      state.files.filter(f=>!f.trashed).forEach(f=>list.push({key:'file-'+f.id,group:'Files',label:f.name,sub:f.type,icon:fileIcon(f),run:()=>openFile(f)}));
      list.push(
        {key:'act-theme',group:'Actions',label:'Toggle color theme',sub:'dark / light / eclipse',icon:'moon',run:()=>setSetting({theme:state.settings.theme==='dark'?'light':state.settings.theme==='light'?'eclipse':'dark'})},
        {key:'act-note',group:'Actions',label:'Create new note',sub:'Ctrl+N',icon:'notes',run:()=>openApp('notes')},
        {key:'act-wall',group:'Actions',label:'Change wallpaper',sub:'Appearance',icon:'image',run:()=>openApp('settings')},
        {key:'act-trash',group:'Actions',label:'Empty trash',sub:'Destructive',icon:'trash',run:()=>emptyTrash()},
        {key:'act-close',group:'Actions',label:'Close top window',sub:'Ctrl+W',icon:'close',run:()=>{const w=state.windows.filter(x=>!x.minimized).reduce((a,x)=>!a||x.z>a.z?x:a,null);if(w)closeWindow(w.id)}},
        {key:'act-reset',group:'Actions',label:'Close all windows',sub:'Clean desktop',icon:'grid',run:()=>state.windows.forEach(w=>closeWindow(w.id))}
      );
      return list;
    },[state.files,state.windows,state.settings]);
    const filtered=entries.filter(e=>(e.label+' '+e.sub).toLowerCase().includes(q.toLowerCase())).slice(0,40);
    useEffect(()=>setSel(0),[q]);
    function choose(e){e?.run();onClose()}
    return <div className="overlay" onMouseDown={e=>e.target===e.currentTarget&&onClose()}>
      <div className="palette glass">
        <div className="palette-input"><Icon name="search" size={19}/><input autoFocus placeholder="Search apps, files, actions…" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{
          if(e.key==='ArrowDown'){e.preventDefault();setSel(Math.min(sel+1,filtered.length-1))}
          if(e.key==='ArrowUp'){e.preventDefault();setSel(Math.max(sel-1,0))}
          if(e.key==='Enter'){e.preventDefault();choose(filtered[sel])}
          if(e.key==='Escape')onClose();
        }}/><span className="kbd">ESC</span></div>
        <div className="palette-list">
          {filtered.map((e,i)=><div key={e.key}>
            {(i===0||filtered[i-1].group!==e.group)&&<div className="palette-group">{e.group}</div>}
            <div className={'palette-item '+(sel===i?'sel':'')} onMouseEnter={()=>setSel(i)} onClick={()=>choose(e)}>
              <span className="pi-ico"><Icon name={e.icon} size={16}/></span><span className="grow"><b style={{fontSize:13}}>{e.label}</b><span className="tiny muted" style={{display:'block'}}>{e.sub}</span></span>{sel===i&&<span className="kbd">↵</span>}
            </div>
          </div>)}
          {!filtered.length&&<div className="empty"><div><Icon name="search" size={24}/><div className="tiny">No results for “{q}”</div></div></div>}
        </div>
        <div className="row" style={{padding:'9px 16px',borderTop:'1px solid var(--stroke)'}}><span className="kbd">↑</span><span className="kbd">↓</span><span className="tiny muted">navigate</span><span className="grow"/><span className="tiny muted">{filtered.length} results</span><span className="badge">AETHER</span></div>
      </div>
    </div>;
  }

  /* ---------- Boot & lock ---------- */
  function BootScreen({onDone}){
    const logs=['Initializing Aether kernel…','Mounting local storage…','Starting compositor…','Loading applications…','Calibrating glass surfaces…','Welcome back, operator.'];
    const [i,setI]=useState(0);
    useEffect(()=>{
      const t=setInterval(()=>setI(v=>Math.min(v+1,logs.length-1)),320);
      const d=setTimeout(onDone,2000);
      return()=>{clearInterval(t);clearTimeout(d)};
    },[]);
    return <div className="boot" onClick={onDone}><div className="boot-inner">
      <div className="boot-logo"><Icon name="bolt" size={34}/></div>
      <div className="display" style={{fontSize:30,letterSpacing:'.2em',fontWeight:700}}>AETHER</div>
      <div className="muted tiny" style={{letterSpacing:'.3em'}}>DESKTOP ENVIRONMENT</div>
      <div className="boot-bar"><i/></div>
      <div className="boot-log">{logs[i]}</div>
      <div className="muted tiny" style={{marginTop:18,opacity:.5}}>click to skip</div>
    </div></div>;
  }
  function LockScreen({onUnlock,clock}){
    return <div className="lock" onClick={onUnlock}><div>
      <div className="avatar">A</div>
      <div className="display" style={{fontSize:44,fontWeight:700}}>{clock.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
      <div className="muted" style={{fontSize:13,marginTop:4}}>{clock.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div>
      <div className="pill" style={{marginTop:24}}><Icon name="lock" size={13}/>Click anywhere to unlock</div>
    </div></div>;
  }

  /* ---------- Root ---------- */
  function App(){
    return <OSProvider><OSInner/></OSProvider>;
  }
  function OSInner(){
    const {state,openApp,createFile,closeWindow,focusWindow,notify}=useOS();
    const [palette,setPalette]=useState(false);
    const [locked,setLocked]=useState(false);
    const [booting,setBooting]=useState(true);
    const [clock,setClock]=useState(new Date());
    useEffect(()=>{window.__aetherBoot=Date.now()},[]);
    useEffect(()=>{const t=setInterval(()=>setClock(new Date()),1000);return()=>clearInterval(t)},[]);
    useEffect(()=>{
      function key(e){
        const mod=e.ctrlKey||e.metaKey;
        if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();setPalette(v=>!v)}
        else if(mod&&e.key.toLowerCase()==='n'){
          e.preventDefault();
          const id=uid('f');
          createFile({id,name:'untitled-'+new Date().toISOString().slice(11,19).replace(/:/g,'')+'.txt',type:'text',content:''});
          openApp('editor',{fileId:id});
        }
        else if(mod&&e.key.toLowerCase()==='w'){
          e.preventDefault();
          const w=state.windows.filter(x=>!x.minimized).reduce((a,x)=>!a||x.z>a.z?x:a,null);
          if(w)closeWindow(w.id);
        }
        else if(e.altKey&&e.key==='Tab'){
          e.preventDefault();
          const wins=[...state.windows].sort((a,b)=>a.z-b.z);
          if(wins.length)focusWindow(wins[0].id);
        }
        else if(e.key==='Escape'){
          if(palette)setPalette(false);
          else{
            const w=state.windows.filter(x=>!x.minimized).reduce((a,x)=>!a||x.z>a.z?x:a,null);
            if(w)closeWindow(w.id);
          }
        }
      }
      window.addEventListener('keydown',key);
      return()=>window.removeEventListener('keydown',key);
    },[state.windows,palette]);
    return <>
      <Desktop onOpenPalette={()=>setPalette(true)} onLock={()=>setLocked(true)}/>
      {palette&&<CommandPalette onClose={()=>setPalette(false)}/>}
      {locked&&<LockScreen clock={clock} onUnlock={()=>{setLocked(false);notify('Session unlocked','Welcome back','shield')}}/>}
      {booting&&<BootScreen onDone={()=>setBooting(false)}/>}
    </>;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

  </script>
</body>
</html>
